<?xml version="1.0" ?><!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<!-- simplified, pixel aligned version of hst-commander.svg for 32x32 icons -->
<svg height="32px" version="1.1" viewBox="0 0 32 32" width="32px" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <g fill="#606060">
    <rect x="0" y="3" width="32" height="26" fill="#ffffff" />

    <!-- box -->
    <rect x="0" y="3" width="32" height="2" />
    <rect x="0" y="27" width="32" height="2" />
    <rect x="0" y="3" width="2" height="26" />
    <rect x="30" y="3" width="2" height="26" />

    <!-- title bar -->
    <rect x="4" y="6" width="2" height="2" />
    <rect x="8" y="6" width="2" height="2" />
    <rect x="0" y="9" width="32" height="2" />

    <!-- panes -->
    <rect x="4" y="13" width="11" height="1" />
    <rect x="4" y="24" width="11" height="1" />
    <rect x="4" y="13" width="1" height="12" />
    <rect x="14" y="13" width="1" height="12" />
    <rect x="17" y="13" width="11" height="1" />
    <rect x="17" y="24" width="11" height="1" />
    <rect x="17" y="13" width="1" height="12" />
    <rect x="27" y="13" width="1" height="12" />

    <!-- entries -->
    <rect x="6" y="15" width="6" height="2" />
    <rect x="6" y="18" width="7" height="2" />
    <rect x="6" y="21" width="5" height="2" />
    <rect x="19" y="15" width="5" height="2" />
    <rect x="19" y="18" width="7" height="2" />
  </g>
</svg>
