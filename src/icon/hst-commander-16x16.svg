<?xml version="1.0" ?><!DOCTYPE svg  PUBLIC '-//W3C//DTD SVG 1.1//EN'  'http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd'>
<!-- simplified, pixel aligned version of hst-commander.svg for 16x16 icons -->
<svg height="16px" version="1.1" viewBox="0 0 16 16" width="16px" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
  <g fill="#606060">
    <rect x="0" y="1" width="16" height="14" fill="#ffffff" />

    <!-- box -->
    <rect x="0" y="1" width="16" height="1" />
    <rect x="0" y="14" width="16" height="1" />
    <rect x="0" y="1" width="1" height="14" />
    <rect x="15" y="1" width="1" height="14" />

    <!-- title bar -->
    <rect x="2" y="2" width="1" height="1" />
    <rect x="4" y="2" width="1" height="1" />
    <rect x="0" y="3" width="16" height="1" />

    <!-- panes divider -->
    <rect x="7" y="3" width="2" height="12" />

    <!-- entries -->
    <rect x="2" y="5" width="4" height="1" />
    <rect x="2" y="7" width="3" height="1" />
    <rect x="2" y="9" width="4" height="1" />
    <rect x="2" y="11" width="2" height="1" />
    <rect x="10" y="5" width="3" height="1" />
    <rect x="10" y="7" width="4" height="1" />
    <rect x="10" y="9" width="3" height="1" />
  </g>
</svg>
